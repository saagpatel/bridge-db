<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Georgia, serif">
  <!-- bridge-db: four systems sharing one SQLite file. Public-safe: structure only. -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b675f"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#faf8f4"/>

  <text x="480" y="42" text-anchor="middle" font-size="26" fill="#1c1a17">bridge-db: four systems sharing one file</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#6b675f" font-style="italic">a SQLite-backed coordination server for a small fleet of AI agents</text>

  <!-- callers -->
  <g font-size="13" text-anchor="middle">
    <g fill="#ffffff" stroke="#e2ded6">
      <rect x="150" y="92" width="120" height="34" rx="8"/>
      <rect x="290" y="92" width="120" height="34" rx="8"/>
      <rect x="430" y="92" width="120" height="34" rx="8"/>
      <rect x="570" y="92" width="120" height="34" rx="8"/>
      <rect x="710" y="92" width="120" height="34" rx="8"/>
    </g>
    <g fill="#1c1a17">
      <text x="210" y="114">Claude Code</text>
      <text x="350" y="114">Codex</text>
      <text x="490" y="114">Claude.ai</text>
      <text x="630" y="114">Notion OS</text>
      <text x="770" y="114">personal-ops</text>
    </g>
  </g>
  <line x1="480" y1="126" x2="480" y2="158" stroke="#6b675f" marker-end="url(#arr)"/>
  <text x="496" y="148" font-size="12" fill="#6b675f" font-style="italic">26 MCP tools, stdio</text>

  <!-- plane 1: coordination -->
  <rect x="60" y="166" width="420" height="200" rx="10" fill="#e8eefc" opacity="0.55"/>
  <text x="80" y="192" font-size="16" fill="#1d4ed8">1 · Coordination</text>
  <text x="80" y="211" font-size="12" fill="#6b675f" font-style="italic">who does what next, without clobbering anyone</text>
  <g font-size="12.5" fill="#1c1a17">
    <text x="80" y="238">pending_handoffs</text>
    <text x="96" y="256" fill="#6b675f">claim = guarded UPDATE, one winner</text>
    <text x="96" y="273" fill="#6b675f">trust-gated pickup · claimant-gated clear</text>
    <text x="80" y="299">context_sections</text>
    <text x="96" y="317" fill="#6b675f">integer-version CAS on every write</text>
    <text x="80" y="343">write_conflicts</text>
    <text x="96" y="361" fill="#6b675f">durable receipt for every refusal or displacement</text>
  </g>

  <!-- plane 2: memory -->
  <rect x="490" y="166" width="410" height="200" rx="10" fill="#fdf1e2" opacity="0.6"/>
  <text x="510" y="192" font-size="16" fill="#b45309">2 · Memory</text>
  <text x="510" y="211" font-size="12" fill="#6b675f" font-style="italic">what happened, findable later</text>
  <g font-size="12.5" fill="#1c1a17">
    <text x="510" y="238">activity_log</text>
    <text x="526" y="256" fill="#6b675f">rolling window per source · protected tags never pruned</text>
    <text x="510" y="282">system_snapshots</text>
    <text x="526" y="300" fill="#6b675f">last known state per system, retained per family</text>
    <text x="510" y="326">content_index (FTS5)</text>
    <text x="526" y="344" fill="#6b675f">same-transaction mirror of all four content tables;</text>
    <text x="526" y="360" fill="#6b675f">drift is a hard health failure · recall = bm25 search</text>
  </g>

  <!-- plane 3: accountability -->
  <rect x="60" y="382" width="420" height="176" rx="10" fill="#f1ebfc" opacity="0.6"/>
  <text x="80" y="408" font-size="16" fill="#6d28d9">3 · Accountability</text>
  <text x="80" y="427" font-size="12" fill="#6b675f" font-style="italic">claims require evidence</text>
  <g font-size="12.5" fill="#1c1a17">
    <text x="80" y="454">shipped_sync_receipts</text>
    <text x="96" y="472" fill="#6b675f">proof a shipped event reached its downstream</text>
    <text x="80" y="498">shipped_event_dispositions</text>
    <text x="96" y="516" fill="#6b675f">explicit policy reason when no sync is owed</text>
    <text x="80" y="542" fill="#6b675f">unresolved SHIPPED rows nag in health until terminal</text>
  </g>

  <!-- plane 4: verification -->
  <rect x="490" y="382" width="410" height="176" rx="10" fill="#e8f5ec" opacity="0.6"/>
  <text x="510" y="408" font-size="16" fill="#15803d">4 · Verification</text>
  <text x="510" y="427" font-size="12" fill="#6b675f" font-style="italic">the system asserting itself</text>
  <g font-size="12.5" fill="#1c1a17">
    <text x="510" y="454">always() / sometimes()</text>
    <text x="526" y="472" fill="#6b675f">live invariants in production · reachability counters</text>
    <text x="510" y="498">deterministic simulation harness</text>
    <text x="526" y="516" fill="#6b675f">seeded clock, scheduler, and fault injection over real code</text>
    <text x="510" y="542" fill="#6b675f">every bug-finding seed pinned, replayed forever</text>
  </g>

  <!-- the file -->
  <rect x="230" y="588" width="500" height="52" rx="10" fill="#1c1a17"/>
  <text x="480" y="614" text-anchor="middle" font-size="15" fill="#faf8f4">bridge.db · one SQLite file · WAL mode</text>
  <text x="480" y="632" text-anchor="middle" font-size="11.5" fill="#a09b90">forward-only migration ladder, v1 → v13</text>
  <line x1="270" y1="558" x2="330" y2="586" stroke="#6b675f" marker-end="url(#arr)"/>
  <line x1="690" y1="558" x2="630" y2="586" stroke="#6b675f" marker-end="url(#arr)"/>
  <line x1="270" y1="368" x2="270" y2="380" stroke="#faf8f4" stroke-width="0"/>

  <text x="480" y="676" text-anchor="middle" font-size="12" fill="#6b675f" font-style="italic">markdown export (atomic rename) rides alongside as a fallback channel, guarded by export-state CAS</text>
</svg>
